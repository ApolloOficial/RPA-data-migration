AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Apollo legacy data migration scheduled every five minutes

Parameters:
  DatabaseSecretArn:
    Type: String
    Description: ARN of a Secrets Manager secret with both database connection URLs

Resources:
  MigrationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: app.lambda_handler.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 240
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true
